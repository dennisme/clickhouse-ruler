groups:
  - name: api-latency
    interval: 1m
    rules:
      - alert: NoSource
        source: ""
        expr: "SELECT 1 AS value FROM t WHERE ts >= {{ .From }} AND ts < {{ .To }}"
        labels:
          team: payments
          severity: warning
        annotations:
          summary: source is missing
          runbook_url: https://runbooks.internal/no-source
