groups:
  - name: api-latency
    interval: 1m
    rules:
      - alert: EmptyExpr
        sources:
          team: payments
        expr: ""
        labels:
          team: payments
          severity: warning
        annotations:
          summary: empty expression
          runbook_url: https://runbooks.internal/empty-expr
      - alert: TightBraces
        sources:
          team: payments
        expr: "SELECT 1 AS value FROM t WHERE ts >= {{.From}} AND ts < {{- .To }}"
        labels:
          team: payments
          severity: warning
        annotations:
          summary: valid template actions without surrounding spaces
          runbook_url: https://runbooks.internal/tight-braces
      - alert: MissingTo
        sources:
          team: payments
        expr: "SELECT 1 AS value FROM t WHERE ts >= {{ .From }}"
        labels:
          team: payments
          severity: warning
        annotations:
          summary: query has no upper time bound
          runbook_url: https://runbooks.internal/missing-to
      - alert: TemplatedIdentifiers
        sources:
          team: payments
        expr: "SELECT 1 AS value FROM {{ .Table }} WHERE {{ .TimestampColumn }} >= {{ .From }} AND {{ .TimestampColumn }} < {{ .To }}"
        labels:
          team: payments
          severity: warning
        annotations:
          summary: one rule across sources that name their table differently
          runbook_url: https://runbooks.internal/templated-identifiers
      - alert: MisspelledTable
        sources:
          team: payments
        expr: "SELECT 1 AS value FROM {{ .Tabel }} WHERE ts >= {{ .From }} AND ts < {{ .To }}"
        labels:
          team: payments
          severity: warning
        annotations:
          summary: a typo in a template variable
          runbook_url: https://runbooks.internal/misspelled-table
