groups:
  - name: api-latency
    interval: 1m
    rules:
      - alert: RelativeRunbook
        source: otel_traces
        expr: "SELECT 1 AS value FROM t WHERE ts >= {{ .From }} AND ts < {{ .To }}"
        labels:
          team: payments
          severity: warning
        annotations:
          summary: runbook is a relative path
          runbook_url: /runbooks/relative
      - alert: NoScheme
        source: otel_traces
        expr: "SELECT 1 AS value FROM t WHERE ts >= {{ .From }} AND ts < {{ .To }}"
        labels:
          team: payments
          severity: warning
        annotations:
          summary: runbook is a bare host
          runbook_url: runbooks.internal/no-scheme
      - alert: TemplatedRunbook
        source: otel_traces
        expr: "SELECT 1 AS value FROM t WHERE ts >= {{ .From }} AND ts < {{ .To }}"
        labels:
          team: payments
          severity: warning
        annotations:
          summary: annotations are templated, so a runbook may be too
          runbook_url: https://runbooks.internal/{{ .ServiceName }}
