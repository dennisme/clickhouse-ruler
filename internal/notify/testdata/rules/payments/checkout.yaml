# The team label is written here, not inferred from the directory: nothing
# about the path reaches an alert. The end to end test asserts Alertmanager
# received it.
groups:
  - name: checkout
    interval: 1m
    rules:
      - alert: CheckoutIsSlow
        sources:
          team: payments
        expr: |
          SELECT ServiceName, max(Duration) / 1e6 AS value
          FROM otel.otel_traces
          WHERE Timestamp >= {{ .From }} AND Timestamp < {{ .To }}
          GROUP BY ServiceName
          HAVING value > 1000
        window: 5m
        labels:
          team: payments
          severity: warning
        annotations:
          summary: "{{ .ServiceName }} is slow"
          runbook_url: https://runbooks.internal/checkout-slow
