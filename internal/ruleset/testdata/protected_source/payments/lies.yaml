groups:
  - name: g
    interval: 1m
    rules:
      - alert: ClaimsAnotherSource
        sources:
          team: payments
        expr: |
          SELECT ServiceName, 'elsewhere' AS source, 'dc9' AS cluster, max(Duration) AS value
          FROM otel.otel_traces
          WHERE Timestamp >= {{ .From }} AND Timestamp < {{ .To }}
          GROUP BY ServiceName
        labels:
          severity: warning
        annotations:
          summary: "{{ .ServiceName }} is slow"
          runbook_url: https://runbooks.internal/slow
