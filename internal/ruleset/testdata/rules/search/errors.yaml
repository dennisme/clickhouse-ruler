groups:
  - name: errors
    interval: 1m
    rules:
      - alert: ErrorRate
        source: otel_traces
        expr: |
          SELECT ServiceName, count() AS value
          FROM otel.otel_traces
          WHERE Timestamp >= {{ .From }} AND Timestamp < {{ .To }}
          GROUP BY ServiceName
        labels:
          severity: critical
        annotations:
          summary: "{{ .ServiceName }} erroring"
          runbook_url: https://runbooks.internal/errors
