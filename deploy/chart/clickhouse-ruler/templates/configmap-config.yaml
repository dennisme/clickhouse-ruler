{{- include "clickhouse-ruler.validate" . -}}
{{- if .Values.sources }}
{{/*
The templated operator's file. A ConfigMap rather than a Secret because nothing
secret reaches it: every field here is reviewable configuration and a password
is a path into a mounted Secret (spec 6.2).

Keys are copied through verbatim, so a source in values is a source in the
file, and the only rewrite is passwordSecret becoming password_file.

Where alerts go is in this file too rather than on a flag, because the
credential that reaches it must come from a mounted Secret and never from argv
(spec 6.5).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse-ruler.fullname" . }}-config
  labels:
    {{- include "clickhouse-ruler.labels" . | nindent 4 }}
data:
  ruler.yaml: |
    alertmanagers:
      - urls:
        {{- range .Values.alertmanagerURLs }}
          - {{ . | quote }}
        {{- end }}
      {{- with .Values.alertmanagerAuth }}
      {{- if .basicAuth }}
        basic_auth:
          username: {{ .basicAuth.username | quote }}
          password_file: {{ printf "%s/%s" (include "clickhouse-ruler.alertmanagerSecretDir" $) (default "password" .basicAuth.key) }}
      {{- else if .authorization }}
        authorization:
          type: {{ default "Bearer" .authorization.type | quote }}
          credentials_file: {{ printf "%s/%s" (include "clickhouse-ruler.alertmanagerSecretDir" $) (default "credentials" .authorization.key) }}
      {{- end }}
      {{- end }}
    sources:
    {{- range $s := .Values.sources }}
      - name: {{ $s.name | quote }}
      {{- with omit $s "name" "passwordSecret" }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.passwordSecret }}
        password_file: {{ printf "%s/%s" (include "clickhouse-ruler.passwordSecretDir" (dict "ctx" $ "name" .name)) (default "password" .key) }}
      {{- end }}
    {{- end }}
{{- end }}
