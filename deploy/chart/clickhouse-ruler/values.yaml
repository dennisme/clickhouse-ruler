# Values for clickhouse-ruler.
#
# Two things are required before an install renders: where Alertmanager is, and
# where the rules come from. Everything else has a default that runs.

# -- Container image carrying the `ruler` binary.
image:
  repository: ghcr.io/dennisme/clickhouse-ruler
  # Empty means the chart's appVersion, which is the tool version the chart was
  # released with. Pin a tag here to run a different one.
  tag: ""
  # A digest, `sha256:...`, which is what makes the image immutable: a tag can
  # be moved to different bytes and a digest cannot. Set it and the tag above
  # is not used, so `ruler version` is the only thing left saying which release
  # is running.
  digest: ""
  pullPolicy: IfNotPresent

# Names of Secrets holding registry credentials, for a private mirror of the
# image above.
imagePullSecrets: []

# How many rulers run. More than one works by duplication rather than
# coordination: replicas must carry identical source labels, query load is
# linear in replicas, and a replica label breaks Alertmanager's
# deduplication. See docs/deployment.md.
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

# Alertmanager cluster to deliver to, one entry per member. Every alert is
# posted to every entry, because members gossip and deduplicate, so a balancer
# in front of them is the one topology to avoid. See docs/running.md.
# Required when `sources` is set. With `sourcesSecret.name` the whole
# operator's file comes from that Secret, so its alertmanagers block does too
# and this must be left empty.
alertmanagerURLs: []

# Credential the ruler authenticates to Alertmanager with. Empty for an
# Alertmanager that is not behind auth, which is the common in-cluster case.
#
# The secret itself is never written here. secretName is a Secret this chart
# mounts, and the key inside it holds the bytes, which is the posture
# sources.passwordSecret already takes. basicAuth and authorization write the
# same Authorization header, so set one.
#
# Prefer this over a password in the URL: userinfo in an Alertmanager URL is
# refused, because it would reach the pod spec and the rendered manifest.
#
# alertmanagerAuth:
#   secretName: ruler-alertmanager
#   basicAuth:
#     username: ruler
#     key: password
#   authorization:
#     type: Bearer
#     key: credentials
alertmanagerAuth: {}

# TLS the ruler reaches Alertmanager over, for a private CA or for mTLS. Only
# needed when the trust is not the host's: an Alertmanager behind a public CA
# needs an https URL above and nothing here.
#
# The material is never written here. secretName is a Secret this chart mounts
# and the keys inside it hold the PEM bytes, which is the posture
# alertmanagerAuth already takes. Every url in alertmanagerURLs has to be
# https:// once this is set, because a tls_config that reaches no https url is
# refused.
#
# What a rotation costs is worth knowing before one is due: the client pair is
# read at each handshake, so replacing certKey and keyKey needs nothing, and
# replacing caKey needs a reload. See docs/checks/alertmanager.md.
#
# insecureSkipVerify turns verification off, which is reported as
# alertmanager/tls-insecure and cleared only by an exemption in the operator's
# own file, so it belongs with sourcesSecret rather than here.
#
# alertmanagerTLS:
#   secretName: ruler-alertmanager-tls
#   caKey: ca.pem
#   certKey: tls.crt
#   keyKey: tls.key
#   serverName: alertmanager.monitoring.svc
alertmanagerTLS: {}

ruler:
  # Port the /metrics, /-/healthy, /-/ready and /-/reload surface listens on.
  # The git-sync exec hook posts to this port on localhost.
  port: 9090
  # debug, info, warn or error.
  logLevel: info
  # text or json. The same lines with the same field names either way; json is
  # for a log pipeline that would otherwise parse structured output back out of
  # text.
  logFormat: text
  # How long an in-flight evaluation gets to finish once shutdown starts. The
  # pod's terminationGracePeriodSeconds is this plus ten, so raising it for a
  # slow evaluation raises both. Seconds rather than a duration, because Helm
  # cannot read a Go duration and a second knob could disagree with this one.
  shutdownTimeoutSeconds: 30
  # Any further `ruler run` flags, passed through verbatim, for example
  # ["--recheck-interval=1h"]. The reload endpoint is already on and does not
  # belong here, and neither does --shutdown-timeout: setting it here changes
  # the drain without moving the grace period behind it.
  extraArgs: []

# How rule files reach the ruler's disk, and what asks it to re-read them. The
# ruler watches nothing itself (spec 10.2).
rules:
  # git-sync  a sidecar clones the rules repository, flips a symlink at the
  #           rules path, and its exec hook posts to /-/reload. The default,
  #           because the symlink flip is what stops the ruler reading a tree
  #           half written.
  # configMap an existing ConfigMap is mounted. There is no exec hook, so
  #           nothing reloads unless you add a reloader through
  #           extraContainers.
  delivery: git-sync

  # Directory inside the repository, or inside the ConfigMap's mount, holding
  # the rule files. Empty means the root of either.
  subdirectory: rules

  configMap:
    # Name of the ConfigMap holding the rule files. Required when delivery is
    # configMap.
    name: ""

  gitSync:
    image:
      repository: registry.k8s.io/git-sync/git-sync
      tag: v4.4.0
      pullPolicy: IfNotPresent
    # Repository holding the rule files. Required when delivery is git-sync.
    repo: ""
    # Branch, tag or commit to check out.
    ref: main
    # How long between sync attempts. This is the first half of the lag
    # between a merge and a page; the second is one reload.
    period: 30s
    # History to fetch. 1 is the current commit and nothing else.
    depth: 1
    # Name of a Secret holding git credentials. It is mounted at /etc/git-secret
    # on the sidecar and nothing else: which of git-sync's credential flags read
    # it is yours to say in extraArgs, for example
    # ["--ssh", "--ssh-key-file=/etc/git-secret/ssh"].
    credentialsSecret: ""
    # Any further git-sync flags, for example ["--sparse-checkout-file=..."].
    extraArgs: []
    resources: {}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      # git-sync writes git's own state outside the volume it syncs into, so
      # its root filesystem is writable where the ruler's is not.
      readOnlyRootFilesystem: false

# Sources the ruler evaluates against, templated into `ruler.yaml`. Every
# field a source takes is reviewable configuration except the password, which
# is read out of a mounted Secret: no value in this chart holds one.
#
# sources:
#   - name: traces_eu
#     labels:
#       region: eu-west
#     address: clickhouse-eu.data:9000
#     database: otel
#     username: ruler
#     passwordSecret:
#       name: ruler-clickhouse
#       key: password
#     table: otel_traces
#     timestamp_column: Timestamp
#     evaluation_delay: 1m
#     max_rows: 10000
sources: []

# The other path: a Secret holding the whole operator's file, templated by
# nothing. This is for the topology where the operator's file is the platform
# team's own artifact, owned through CODEOWNERS rather than restated here.
# Setting this and `sources` together is refused.
sourcesSecret:
  name: ""
  key: ruler.yaml

# Policy file contents, mounted as a small object and passed as --policy. Empty
# means no policy file, so every check keeps its default severity.
#
# policy: |
#   checks:
#     rule/cost: error
policy: ""

# Further containers in the pod. This is where a reloader sidecar goes when
# delivery is configMap.
extraContainers: []

# Further volumes and mounts on the ruler container, for a delivery this chart
# does not template.
extraVolumes: []
extraVolumeMounts: []

service:
  type: ClusterIP
  port: 9090
  annotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Scrape configuration for a Prometheus run by the Prometheus Operator. Off by
# default: the kind belongs to those CRDs, so a cluster without them fails the
# whole install on an object the ruler does not need in order to run. Nothing
# on the operations page works until something scrapes this port, by whichever
# route your Prometheus takes.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Labels the Prometheus in question selects its ServiceMonitors by, for
  # example {release: kube-prometheus-stack}.
  labels: {}
  annotations: {}
  relabelings: []
  metricRelabelings: []

# What a node drain may take at once. A ruler keeps every pending alert's
# progress in memory, so a drain that evicts every replica together sends each
# of them back through its full `for`. Off by default, because a budget that
# allows no eviction blocks node maintenance rather than shaping it.
#
# Set one of these, not both.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

# Scheduling priority. Empty means the cluster's default, and the class names
# are the cluster's to define. The component that reports an outage is a poor
# choice for the first one evicted by it.
priorityClassName: ""

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   memory: 512Mi

# Readiness fails when no rules are loaded or no source answers, which is what
# stops a rollout replacing working replicas with broken ones. Liveness only
# asks whether the process is serving.
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

# The image declares a non-numeric user, which kubelet cannot check against
# runAsNonRoot, so the UID is stated here. 100:101 is the `ruler` user
# Dockerfile.goreleaser creates.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
