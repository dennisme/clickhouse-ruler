# The other sources path: a Secret holding the whole file, templated by nothing.
# The same topology pins the image by digest, since the platform team owning
# the operator's file is the one that wants the bytes named rather than the tag.
alertmanagerURLs:
  - http://alertmanager.monitoring:9093
image:
  digest: sha256:9f6f31d6e0cb03f0e8b4ba9c9f1ba2a2b6f2e21b0e2a1c39d1a6f0f0b2c3d4e5
rules:
  gitSync:
    repo: https://github.com/example/alert-rules
sources: []
sourcesSecret:
  name: ruler-config
  key: ruler.yaml
