# Points Grafana at the dashboards this repository ships, so what a person
# opens is the file under review rather than something saved in a browser
# (spec 9.1 item 8).
apiVersion: 1

providers:
  - name: clickhouse-ruler
    type: file
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
