# TLS for the third Alertmanager in the stack, which exists so the ruler's
# tls_config is proven against a server that actually requires TLS (spec 6.5,
# 9.1).
#
# Beside the plain and the authenticated ones rather than replacing either.
# Most of the suite posts over plaintext and the credential test posts over
# basic auth, so all three paths stay covered.
#
# The material is generated by `just alertmanager-certs` on every compose-up
# and is not checked in: a fixture certificate expires, and a private key in a
# git history is a private key in a git history whatever it signs.
tls_server_config:
  cert_file: /etc/alertmanager/tls/server.pem
  key_file: /etc/alertmanager/tls/server-key.pem
