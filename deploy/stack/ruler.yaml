# The operator's file the ruler container reads. Separate from
# cmd/ruler/testdata because that tree is a fixture a test rewrites in place,
# and the addresses it names are the host's rather than ones a container can
# reach (spec 9.1).

# Where this ruler sends. The plain Alertmanager, with no credential: it is on
# a compose network only this container can reach, so there is nothing to
# authenticate against. The credential path is proven by the integration test
# against alertmanager-auth instead (spec 6.5).
alertmanagers:
  - urls: [http://alertmanager:9093]

sources:
  - name: otel_traces
    labels: {team: payments}
    address: clickhouse:9000
    database: otel
    # The restricted user from deploy/clickhouse/init/02-ruler-user.sql, the
    # same one a deployment is expected to use.
    username: ruler_payments
    table: otel_traces
    timestamp_column: Timestamp
    evaluation_delay: 0s

  # The metrics source. A source is a cluster, a user and a table, so the
  # metrics tables are a source of their own rather than a second table on the
  # one above: its user holds SELECT on them and on nothing else.
  #
  # The sum table is what `table:` names, because a counter is what a rule over
  # metrics gets wrong. A rule reading the gauge table names it in the SQL, the
  # way a rule reading any other granted table does.
  - name: otel_metrics
    labels: {team: payments, signal: metrics}
    address: clickhouse:9000
    database: otel
    username: ruler_metrics
    table: otel_metrics_sum
    timestamp_column: TimeUnix
    evaluation_delay: 0s
