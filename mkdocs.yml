# Documentation site, published to GitHub Pages by .github/workflows/docs.yaml.
#
# The check pages under docs/checks are what every finding links to, so the
# anchors they carry are part of the tool's output rather than a detail of the
# site. They are written as HTML elements rather than the `{#id}` attribute
# list this theme also understands, because the same files have to work when
# read on GitHub, where attribute lists render as text (spec 7.8).
site_name: clickhouse-ruler
site_description: Alert rules for ClickHouse, checked before they run.
site_url: https://dennisme.github.io/clickhouse-ruler/
repo_url: https://github.com/dennisme/clickhouse-ruler
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # The edit link only renders when this is on, whatever edit_uri says. A
    # page somebody can correct from the page they noticed the mistake on is
    # the difference between a fix and a note they meant to make later.
    - content.action.edit
    - content.code.copy
    - navigation.sections
    - search.highlight

markdown_extensions:
  - attr_list
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Running it:
      - The binary: running.md
      - Operations: operations.md
      - Deployment topologies: deployment.md
  - Checks:
      - Every check: checks/index.md
      - Rule checks: checks/rule.md
      - Source checks: checks/source.md
      - File and policy checks: checks/policy.md
  - How it compares: comparison.md

# Fail the build on a link to a page that does not exist. The check pages
# carry generated links beside hand-written ones, and a broken cross-reference
# is the failure this area keeps producing.
strict: true
