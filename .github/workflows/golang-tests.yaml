name: Go Test

on:
  push:
    tags:
      - v*
    branches: [main]
  pull_request:

# Fork PRs get a read-only GITHUB_TOKEN, which cannot post a PR comment. The
# coverage comment is posted by coverage-comment.yaml on workflow_run, with the
# base repository's token and the artifact the integration job uploads.
permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -show verbose ./...

      - name: Build
        run: just build

      - name: Unit tests
        run: just test

  # The tests that need a real ClickHouse, run against more than one version.
  #
  # The checks in internal/query read what `EXPLAIN` prints, and that output has
  # no stability guarantee (spec 7.2). Testing only the pinned version proves the
  # readers work against the version they were written for, which is the one
  # thing that was never in doubt. The second leg is how a format change becomes
  # a build that says so, rather than a check that silently stops reporting.
  integration:
    runs-on: ubuntu-latest

    strategy:
      # Both legs always run. A failure on the newer server says nothing about
      # whether the pinned one still works, which is the question the required
      # leg answers.
      fail-fast: false
      matrix:
        include:
          - label: pinned
            image: ""
            required: true

          # Whatever ClickHouse released most recently. Advisory: a new server
          # changing its output is worth knowing about on the pull request that
          # happened to run next, and is not that author's problem to fix.
          - label: newest
            image: clickhouse/clickhouse-server:latest-alpine
            required: false

    name: integration (${{ matrix.label }})
    continue-on-error: ${{ !matrix.required }}

    env:
      # Empty means the version pinned in compose.yaml, which stays the single
      # place that version is written down: naming it here as well would let the
      # required leg go on testing an old server after a bump.
      CLICKHOUSE_IMAGE: ${{ matrix.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Install just
        uses: extractions/setup-just@v3

      # The compose stack rather than a services: block, so CI runs the same
      # ClickHouse image and the same init schema developers run locally.
      # compose-down runs even when the tests fail, so a cancelled or broken
      # run leaves no volume behind.
      #
      # Coverage is measured here rather than beside the unit tests, because the
      # checks in internal/query and most of cmd/ruler are proven against a real
      # ClickHouse. An untagged run credits none of it and reports a number well
      # below what the tree actually covers.
      - name: Integration tests
        run: just coverage-integration-clean

      # Only the pinned leg, which is the required one. Both legs would collide
      # on the artifact name, and a number measured against whatever ClickHouse
      # released this week is not the one to report on a pull request.
      #
      # pr-number.txt travels with the report because
      # workflow_run.pull_requests is often empty for fork PRs, and
      # commits/{sha}/pulls does not resolve a fork head either.
      # github.event.pull_request.number is reliable on a pull_request event.
      - name: Prepare coverage artifact
        if: matrix.required && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          echo -n "${{ github.event.pull_request.number }}" > pr-number.txt
          test -s pr-number.txt
          test -f coverage.xml

      - name: Upload coverage report
        if: matrix.required && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            pr-number.txt
          retention-days: 5
          if-no-files-found: error
