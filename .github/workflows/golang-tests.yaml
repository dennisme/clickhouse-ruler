name: Go Test

on:
  push:
    tags:
      - v*
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -show verbose ./...

      - name: Build
        run: just build

      - name: Unit tests
        run: just test

      # The compose stack rather than a services: block, so CI runs the same
      # ClickHouse image and the same init schema developers run locally.
      # compose-down runs even when the tests fail, so a cancelled or broken
      # run leaves no volume behind.
      - name: Integration tests
        run: just integration-clean

      - name: Coverage
        run: just coverage

      - name: Prepare coverage artifact
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          echo -n "${{ github.event.pull_request.number }}" > pr-number.txt
          test -s pr-number.txt
          test -f coverage.xml

      - name: Upload coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            pr-number.txt
          retention-days: 5
          if-no-files-found: error
