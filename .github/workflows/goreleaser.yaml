name: goreleaser

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history: goreleaser reads the previous tag to build release notes.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # arm64 image layers are built on an amd64 runner.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Packaged outside dist/, which `release --clean` empties, so this does
      # not depend on running after goreleaser.
      #
      # The tag is both version and appVersion, so a chart pulled at a version
      # runs the image of that version by default. Chart.yaml's committed 0.0.0
      # is a placeholder and is never what ships.
      - name: Package the chart
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p .chart-release
          helm package deploy/chart/clickhouse-ruler \
            --version "$version" \
            --app-version "$version" \
            --destination .chart-release

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The chart's OCI path is not the image's repository: a chart and an image
      # sharing one repository share one tag namespace.
      - name: Push the chart to GHCR
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          chart=".chart-release/clickhouse-ruler-${version}.tgz"
          test -f "$chart"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm push "$chart" oci://ghcr.io/dennisme/charts
