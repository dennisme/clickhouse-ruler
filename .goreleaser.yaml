# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: clickhouse-ruler

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ruler
    main: ./cmd/ruler
    binary: ruler
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Version is the only symbol worth stamping: the commit, the build time and
    # whether the tree was dirty come from the toolchain's own vcs record, which
    # internal/buildinfo reads back at runtime.
    ldflags:
      - -s -w
      - -X github.com/dennisme/clickhouse-ruler/internal/buildinfo.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes via GitHub's generate-notes API (merged PRs with full PR URLs).
# Required for real PR links: this repo merges with "Create a merge commit", so
# subjects are plain "feat: …" without "(#N)". Commit-log backends cannot
# invent PR associations; github-native can.
#
# Groups / format / filters are not applied with github-native.
changelog:
  use: github-native

# Multi-arch image (buildx). Dockerfile.goreleaser packages the binary built
# above; it does not recompile. The root Dockerfile is the build-from-source
# one and is not used here.
#
# Two tags: the tag itself, which is what a deployment pins, and latest. No
# versionless or major/minor tags, because nothing reads one yet.
dockers_v2:
  - images:
      - ghcr.io/dennisme/clickhouse-ruler
    tags:
      - "{{ .Tag }}"
      - latest
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Prometheus-style alert rules evaluated as ClickHouse SQL, checked before they run"
      "org.opencontainers.image.url": "https://dennisme.github.io/clickhouse-ruler/"
      "org.opencontainers.image.source": "https://github.com/dennisme/clickhouse-ruler"
      "org.opencontainers.image.licenses": "Apache-2.0"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"

# The chart ships as an OCI artifact to the registry the image is already in,
# pushed from the same tag so the chart version is the tool version (spec 10.2).
# It lands at ghcr.io/dennisme/charts/clickhouse-ruler rather than beside the
# image's own tags, because a chart and an image sharing one repository share
# one tag namespace.
#
# The packaging and the push are steps in .github/workflows/goreleaser.yaml.
# goreleaser has no chart step, and its `publishers` run once per artifact rather
# than once per release, so `helm push` here would push the same chart once per
# binary. Chart.yaml's committed version is a placeholder; the tag is the only
# real one.

# Appended after the generated changelog on the GitHub Release, because a
# release that builds a chart and does not say so leaves the answer to "how do I
# run this" in the repository rather than in the release.
release:
  footer: |
    ---

    **Container image:** `ghcr.io/dennisme/clickhouse-ruler:{{ .Tag }}`

    **Helm (OCI):**
    ```
    helm upgrade --install ruler oci://ghcr.io/dennisme/charts/clickhouse-ruler \
      --version {{ .Version }} --namespace monitoring --create-namespace \
      --values deploy/examples/git-sync.yaml
    ```

    **Docs:** https://dennisme.github.io/clickhouse-ruler/
