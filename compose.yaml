# Local dev stack: ClickHouse and Alertmanager. The OpenTelemetry collector and
# the telemetry generators arrive with the scheduler (spec section 9).
#
# The webhook sink is not a container. It runs inside the integration test so
# assertions can read delivered payloads directly, which is why Alertmanager
# routes to host.docker.internal on a fixed port.
#
# The data directory is a named volume rather than an anonymous one so that
# `just compose-down` can actually remove it. Anonymous volumes survive a
# plain `docker compose down` and pile up across rebuilds.
#
# It matters here more than usual: the init scripts below only run when the
# data directory is empty, so editing the schema and restarting does nothing
# unless the volume is destroyed first.
services:
  clickhouse:
    # The pinned version is what a developer gets and what the required CI leg
    # runs. CLICKHOUSE_IMAGE overrides it so the same stack can be pointed at a
    # newer server, which is how the checks that read `EXPLAIN` output find out
    # that the output changed (spec 7.2).
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8.2.29-alpine}
    container_name: ruler-clickhouse
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: ruler
      CLICKHOUSE_PASSWORD: ruler
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./deploy/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The second shard. It exists so a distributed query has somewhere to fan out
  # to and something to lose: with one node, a query whose shard is unreachable
  # cannot be written at all, and the setting that decides whether that query
  # fails or quietly returns half the rows cannot be tested (spec 6.9).
  #
  # It runs the same image and the same init as the first node, so the ruler's
  # user and its one table exist on both, the way they would on a real cluster.
  # The cost is startup: a second server to start and health check on every
  # integration run, local and in CI. Nothing but the sharded tests reads it,
  # and everything else keeps talking to the first node on its own port.
  clickhouse2:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8.2.29-alpine}
    container_name: ruler-clickhouse2
    ports:
      - "127.0.0.1:9001:9000"
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: ruler
      CLICKHOUSE_PASSWORD: ruler
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./deploy/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - clickhouse2-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: ruler-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    # host-gateway is what lets the container reach the sink running on the
    # host. Docker Desktop defines host.docker.internal already; plain Linux
    # docker, which is what CI runs, does not.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --log.level=warn
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  clickhouse-data:
  clickhouse2-data:
