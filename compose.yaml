# Local dev stack: ClickHouse, Alertmanager, the ruler, Prometheus and Grafana.
# The OpenTelemetry collector and the telemetry generators are still to come
# (spec section 9).
#
# The webhook sink is not a container. It runs inside the integration test so
# assertions can read delivered payloads directly, which is why Alertmanager
# routes to host.docker.internal on a fixed port.
#
# The data directory is a named volume rather than an anonymous one so that
# `just compose-down` can actually remove it. Anonymous volumes survive a
# plain `docker compose down` and pile up across rebuilds.
#
# It matters here more than usual: the init scripts below only run when the
# data directory is empty, so editing the schema and restarting does nothing
# unless the volume is destroyed first.
services:
  clickhouse:
    # The pinned version is what a developer gets and what the required CI leg
    # runs. CLICKHOUSE_IMAGE overrides it so the same stack can be pointed at a
    # newer server, which is how the checks that read `EXPLAIN` output find out
    # that the output changed (spec 7.2).
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8.2.29-alpine}
    container_name: ruler-clickhouse
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: ruler
      CLICKHOUSE_PASSWORD: ruler
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./deploy/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  # The second shard. It exists so a distributed query has somewhere to fan out
  # to and something to lose: with one node, a query whose shard is unreachable
  # cannot be written at all, and the setting that decides whether that query
  # fails or quietly returns half the rows cannot be tested (spec 6.9).
  #
  # It runs the same image and the same init as the first node, so the ruler's
  # user and its one table exist on both, the way they would on a real cluster.
  # The cost is startup: a second server to start and health check on every
  # integration run, local and in CI. Nothing but the sharded tests reads it,
  # and everything else keeps talking to the first node on its own port.
  clickhouse2:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8.2.29-alpine}
    container_name: ruler-clickhouse2
    ports:
      - "127.0.0.1:9001:9000"
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: ruler
      CLICKHOUSE_PASSWORD: ruler
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./deploy/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - clickhouse2-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: ruler-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    # host-gateway is what lets the container reach the sink running on the
    # host. Docker Desktop defines host.docker.internal already; plain Linux
    # docker, which is what CI runs, does not.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --log.level=warn
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Writes the rows the rules read, so a rule is proven against real collector
  # output rather than against rows a test inserted (spec 9.1 item 2).
  #
  # No healthcheck: the image is distroless and carries no shell, so there is
  # nothing a compose healthcheck could exec. What proves it is working is a row
  # arriving, and that is what the test waits for.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: ruler-otel-collector
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./deploy/collector/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  # The code under test, built from this checkout rather than pulled: a
  # published image is the last release, and the stack exists to run what is in
  # the tree (spec 9.1 item 5).
  #
  # Its rules evaluate and never fire, so the alerts Alertmanager delivers are
  # the ones a test sent and nothing else.
  ruler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruler
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/stack:/etc/ruler:ro
    command:
      - run
      - --rules=/etc/ruler/rules
      - --config=/etc/ruler/ruler.yaml
      - --alertmanager=http://alertmanager:9093
      - --listen=:9090
      - --log-level=warn
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse2:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  # What the dashboards query. The ruler itself reads nothing from it, and
  # without it 8.6's panels have nothing behind them at all (spec 9.1 item 7).
  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: ruler-prometheus
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
      - --log.level=warn
    depends_on:
      ruler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Here so a person can open the dashboards and see them working. No test
  # reads it: the datasource, not the renderer, is what knows whether an
  # expression matches anything (spec 9.8).
  #
  # Nothing is configured through its UI, for the reason rules are files. A
  # dashboard that exists only in somebody's browser cannot be reviewed.
  grafana:
    image: grafana/grafana:12.1.1
    container_name: ruler-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # A local stack on a loopback port has nobody to authenticate against,
      # and a login prompt between a person and the panels is the reason
      # dashboards go unopened.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_LOG_LEVEL: warn
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Background volume, so the checks are read against a realistically busy
  # table rather than one holding only what a test put there (spec 9.2).
  #
  # Behind a profile rather than on by default. Every assertion in the tree was
  # written against a table only tests write to, and rows arriving on their own
  # would be a second author of the data every one of them reads. Start it with
  # `just compose-volume` when that is what is wanted.
  telemetrygen:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0
    container_name: ruler-telemetrygen
    profiles: [volume]
    command:
      - traces
      - --otlp-endpoint=otel-collector:4317
      - --otlp-insecure
      - --service=background
      - --rate=50
      - --duration=1h
    depends_on:
      - otel-collector

volumes:
  clickhouse-data:
  clickhouse2-data:
